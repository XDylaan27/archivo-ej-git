<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página Web</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>¡Bienvenido a mi primera página web! 🚀</h1>
        <p class="subtitle">Esta es una página simple para practicar HTML, CSS y JavaScript</p>
        
        <div class="card">
            <h2>Mi contenido interactivo</h2>
            <p>Haz clic en el botón para ver la magia:</p>
            <button id="miBoton">Haz clic aquí</button>
            <p id="mensaje"></p>
        </div>

        <div class="counter">
            <h3>Contador de clics:</h3>
            <p id="contador">0</p>
            <button id="btnContador">+1</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
